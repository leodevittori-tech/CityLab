<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>CityLab — La tua città</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4ff;font-family:system-ui,Arial;overflow:hidden}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#18263b;gap:8px}h1{font-size:19px;margin:0}button{border:0;border-radius:11px;padding:10px 12px;background:#293d58;color:white;font-weight:700;cursor:pointer}button.active{background:#21a66b}button:active{transform:scale(.97)}#tools{display:flex;gap:7px;overflow-x:auto;padding:10px;background:#152238;scrollbar-width:thin}#tools button{white-space:nowrap}#stage{position:relative;height:calc(100dvh - 165px);overflow:hidden;touch-action:none;background:#81b977}canvas{width:100%;height:100%;display:block;touch-action:none}#bottom{height:55px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#18263b;justify-content:space-between}#bottom button{padding:9px}small{opacity:.75}#hint{position:absolute;bottom:12px;left:12px;background:#17263bdc;padding:9px 12px;border-radius:10px;font-size:12px;pointer-events:none}#zoom{display:flex;gap:5px}@media(max-width:650px){header{height:54px}#stage{height:calc(100dvh - 161px)}h1{font-size:16px}small{font-size:10px}#hint{font-size:11px}}</style></head><body><header><div><h1>🏙️ CityLab</h1><small>Costruisci la tua città • gratis</small></div><div><button id="save">💾 Salva</button><button id="reset">🗑️</button></div></header><nav id="tools"></nav><div id="stage"><canvas id="cv"></canvas><div id="hint">Tocca o trascina per costruire • due dita per spostarti</div></div><footer id="bottom"><span id="status">🚗 Traffico attivo</span><div id="zoom"><button id="minus">−</button><button id="plus">＋</button></div><button id="traffic">⏸️ Pausa</button></footer><script>
const types=[['road','🛣️ Strada'],['cross','🚶 Strisce'],['house','🏠 Casa'],['tower','🏢 Palazzo'],['shop','🏪 Negozio'],['factory','🏭 Fabbrica'],['park','🌳 Parco'],['tree','🌲 Albero'],['light','🚦 Semaforo'],['car','🚗 Auto'],['truck','🚚 Camion'],['bus','🚌 Autobus'],['erase','🧽 Cancella']];const toolbar=document.querySelector('#tools');let selected='road';types.forEach(([id,name])=>{let b=document.createElement('button');b.textContent=name;b.dataset.id=id;b.onclick=()=>{selected=id;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('active',x.dataset.id===id))};toolbar.append(b)});toolbar.firstChild.classList.add('active');const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');let W=0,H=0,cell=54,zoom=1,offsetX=0,offsetY=0,paused=false,tiles={},cars=[];const key=(x,y)=>x+','+y;function store(){localStorage.setItem('citylab-v1',JSON.stringify({tiles,cars}))}try{let saved=JSON.parse(localStorage.getItem('citylab-v1'));if(saved){tiles=saved.tiles||{};cars=saved.cars||[]}}catch(e){}function resize(){let r=stage.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();function world(px,py){return{x:Math.floor((px-offsetX)/(cell*zoom)),y:Math.floor((py-offsetY)/(cell*zoom))}}function paint(x,y){if(Math.abs(x)>120||Math.abs(y)>120)return;let k=key(x,y);if(selected==='erase'){delete tiles[k];cars=cars.filter(c=>!(Math.floor(c.x)===x&&Math.floor(c.y)===y))}else if(['car','truck','bus'].includes(selected)){if(['road','cross','light'].includes(tiles[k]))cars.push({x:x+.5,y:y+.5,type:selected,dir:Math.random()<.5?0:1,color:['#f04757','#ffc843','#5ca8ff','#f7f7f7'][Math.floor(Math.random()*4)]})}else tiles[k]=selected;store()}let drawing=false,last='',touches=[];function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.push({id:e.pointerId,...pos(e)});if(touches.length===1){drawing=true;let p=pos(e),w=world(p.x,p.y);last=key(w.x,w.y);paint(w.x,w.y)}});canvas.addEventListener('pointermove',e=>{let t=touches.find(t=>t.id===e.pointerId);if(!t)return;let p=pos(e);if(touches.length>1){offsetX+=p.x-t.x;offsetY+=p.y-t.y;drawing=false}else if(drawing){let w=world(p.x,p.y),k=key(w.x,w.y);if(k!==last){paint(w.x,w.y);last=k}}t.x=p.x;t.y=p.y});function end(e){touches=touches.filter(t=>t.id!==e.pointerId);drawing=false}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#81b977';ctx.fillRect(0,0,W,H);let s=cell*zoom;let minX=Math.floor(-offsetX/s)-1,maxX=Math.ceil((W-offsetX)/s)+1,minY=Math.floor(-offsetY/s)-1,maxY=Math.ceil((H-offsetY)/s)+1;ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(zoom,zoom);for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){let px=x*cell,py=y*cell,t=tiles[key(x,y)];ctx.strokeStyle='#ffffff18';ctx.lineWidth=1;ctx.strokeRect(px,py,cell,cell);if(!t)continue;ctx.save();ctx.translate(px,py);if(['road','cross','light'].includes(t)){ctx.fillStyle='#454b55';ctx.fillRect(0,0,cell,cell);let n=['road','cross','light'].includes(tiles[key(x,y-1)]),so=['road','cross','light'].includes(tiles[key(x,y+1)]),l=['road','cross','light'].includes(tiles[key(x-1,y)]),r=['road','cross','light'].includes(tiles[key(x+1,y)]);ctx.strokeStyle='#f8e8a2';ctx.lineWidth=2;ctx.setLineDash([8,7]);ctx.beginPath();if(n||so||(!l&&!r)){ctx.moveTo(27,0);ctx.lineTo(27,54)}else{ctx.moveTo(0,27);ctx.lineTo(54,27)}ctx.stroke();ctx.setLineDash([]);if(t==='cross'){ctx.fillStyle='#fff';for(let i=0;i<5;i++)ctx.fillRect(8+i*8,17,5,20)}if(t==='light'){ctx.font='29px system-ui';ctx.fillText('🚦',14,35)}}else{ctx.fillStyle=t==='park'?'#4fa46b':'#9abf82';ctx.fillRect(2,2,50,50);let emojis={house:'🏠',tower:'🏢',shop:'🏪',factory:'🏭',park:'🌳',tree:'🌲'};ctx.font='37px system-ui';ctx.textAlign='center';ctx.fillText(emojis[t]||'',27,42)}ctx.restore()}for(let c of cars){ctx.save();ctx.translate(c.x*cell,c.y*cell);ctx.fillStyle=c.color;ctx.shadowColor='#0007';ctx.shadowBlur=5;let horizontal=c.dir===1;ctx.translate(0,0);ctx.fillRect(horizontal?-19:-11,horizontal?-11:-19,horizontal?38:22,horizontal?22:38);ctx.shadowBlur=0;ctx.fillStyle='#c7ecff';ctx.fillRect(horizontal?-7:-8,horizontal?-9:-7,horizontal?14:16,horizontal?18:14);if(c.type==='truck'||c.type==='bus'){ctx.fillStyle=c.type==='bus'?'#f5c344':'#f7f7f7';ctx.fillRect(horizontal?-20:-12,horizontal?-12:-21,horizontal?24:24,horizontal?24:24)}ctx.restore()}ctx.restore();if(!paused){for(let c of cars){let speed=c.type==='truck'?.004:c.type==='bus'?.005:.008;let dx=c.dir===1?speed:0,dy=c.dir===0?speed:0;let nx=c.x+dx,ny=c.y+dy;if(['road','cross','light'].includes(tiles[key(Math.floor(nx),Math.floor(ny))])){c.x=nx;c.y=ny}else{let options=[[0,1],[1,0],[0,-1],[-1,0]].filter(([a,b])=>['road','cross','light'].includes(tiles[key(Math.floor(c.x+a*.65),Math.floor(c.y+b*.65))]));if(options.length){let [a,b]=options[Math.floor(Math.random()*options.length)];c.dir=a!==0?1:0;c.x=Math.floor(c.x)+.5;c.y=Math.floor(c.y)+.5;if(a<0||b<0){c.dir=a<0?3:2}}}}}requestAnimationFrame(draw)}function zoomBy(f){zoom=Math.min(2.6,Math.max(.45,zoom*f))}document.querySelector('#plus').onclick=()=>zoomBy(1.25);document.querySelector('#minus').onclick=()=>zoomBy(.8);document.querySelector('#save').onclick=()=>{store();alert('Città salvata su questo dispositivo!')};document.querySelector('#reset').onclick=()=>{if(confirm('Vuoi cancellare tutta la città?')){tiles={};cars=[];store()}};document.querySelector('#traffic').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶️ Riprendi':'⏸️ Pausa';document.querySelector('#status').textContent=paused?'🚗 Traffico fermo':'🚗 Traffico attivo'};if(!Object.keys(tiles).length){for(let x=-4;x<=4;x++)tiles[key(x,1)]='road';for(let y=-3;y<=4;y++)tiles[key(0,y)]='road';tiles[key(0,1)]='cross';tiles[key(-2,0)]='house';tiles[key(2,0)]='tower';tiles[key(-2,2)]='park';tiles[key(2,2)]='shop';offsetX=W/2;offsetY=H/2;store()}else{offsetX=W/2;offsetY=H/2}draw();setInterval(()=>{if(!paused)store()},10000);
</script></body></html>
